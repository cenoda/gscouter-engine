# Xiangling: content record. Format: docs/content-format.md.
#
# Layer 1 (talent tables, base stats, passives and constellations) carries
# the legacy values at full precision and, beside them, the official values
# the step 0 pilot read from HoYoWiki at display precision
# (docs/pilot-xiangling/official.md, official.json). Layer 2 carries the
# legacy values and the public evidence of docs/pilot-xiangling/hidden.md.
# Begun by content/scripts/xiangling_record.py; edited by hand since.
#
# `select = "legacy"`: Xiangling is existing content, so the engine keeps her
# legacy data (docs/independence.md §4, "Existing data"); `gsc convert
# --select independent` and `gsc status` show her as new content would be.
