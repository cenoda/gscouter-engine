# Compares the engine with gcsim on the library teams the engine supports,
# and counts what blocks the others. Gscouter is checked out at a fixed
# commit; gcsim is fixed by reference/go.mod (Gscouter's fork,
# cenoda/gcsim@eb21884, the same commit Gscouter's go.mod pins).
#
# compare decides at Gscouter's accuracy (the site scores 50 iterations,
# about 0.7% of standard error): a build runs 4,000 iterations, and up to
# 32,000 when it fails or is inconclusive there; an interval still across
# the bound at 32,000 is decided by its estimate. The variants, build space
# and pages run a sample of 4 builds of each kind per team (compare
# -sample 4; a page's one-pass configs are always run), chosen by a hash so
# that different teams draw different builds and every item is reached
# across the library. Each report gives the drift, the mean difference
# over its builds; the release's approval.md gives it over all of them.
#
# Every push compares the library builds and the probes, in four parallel
# parts. The variants (builds with their stats moved) run on a schedule: the teams are split into PARTS
# parts, and each day runs PER_DAY of them, so every team's variants run
# every PARTS / PER_DAY days. A manual run can name the parts to run, e.g.
# "0-39" for all of them, or "library" for the push run.
#
# The build-space variants (builds that change one member's constellation,
# refinement or weapon; compare -only buildspace) are about 34 runnable
# builds per supported team, some 9,300 in all, so they run on the same
# schedule in their own parts: BS_PARTS parts, BS_PER_DAY of them a day. A
# manual run names them in "buildspace" ("0-79" for all).
#
# The pages (compare -only pages) are the other configs a result page runs:
# every rotation and filler candidate its search tries and the one-pass
# config, for the library build and for no ER from artifacts (about 40
# per team; reference/compare/pages.go). They run on the same schedule in
# PG_PARTS parts, PG_PER_DAY a day; a manual run names them in "pages"
# ("0-79" for all). The library builds run only when a run names no parts
# of any kind.
#
# Variant and build-space jobs pass compare -deadline, below the job's
# time limit: past it compare starts no more builds and grows none further,
# reports the builds it did not start as deferred, and the job still writes
# its report and uploads gcsim's chunks; the next run of the part finds
# those chunks in the cache.
#
# gcsim's results are cached by config and chunk of seeds (reference/
# harness/cache.go), so a run computes only what no earlier run did. Each
# job restores the latest cache and uploads the chunks it added; the last
# job merges them and saves the result as the next cache. The key changes
# with gcsim (go.sum) and the harness, which starts the cache afresh.
#
# A manual run with "warm" set to team ids runs gcsim alone on those teams'
# builds (library, variants, probes; compare -gcsim-only), whether the
# engine supports them or not, and adds the chunks to the cache, so that a
# port's compare runs only the engine for the teams it unblocks. It runs
# nothing else. Dispatch it on main: a cache saved on main is visible to
# every branch, one saved on a branch only to that branch. (A branch that
# has saved a cache of its own restores that one, not main's, so dispatch
# it before the port's first push.)
#
# A manual run with "rerun" set to team/build pairs (as the report names
# them) compares those builds again, one job each, up to "rerun_max_iter"
# iterations (2,048,000 by default; compare -builds), for a build whose
# settled verdict needs a closer look. It runs nothing else, and its gcsim
# chunks go to the cache as other jobs' do.
#
# gcsim is most of a rerun's time, so "rerun_shards" (1 by default: as
# above) splits it: with k > 1, each build's gcsim on seeds [0,
# rerun_max_iter) is first split evenly over k jobs (rerun-gcsim: compare
# -builds b -gcsim-only -seeds lo:hi, a matrix of builds by shards, at most
# 256 jobs), each uploading its chunks; then each build's rerun job adds
# its shards' chunks to the restored cache and compares as above, running
# only the engine up to rerun_max_iter. The cache job takes every job's
# chunks, as for the other jobs. A shard job that fails or stops at its
# deadline leaves its seeds to the rerun job's gcsim.
#
# A manual run with "release" set to true runs every kind of build at one
# commit: the library builds and probes, every variant part, every
# build-space part and every page part. Its manifest job then builds the
# WebAssembly module (wasm/) and writes the teams Gscouter may run on it
# (reference/manifest: a team is verified when every build of every kind
# that the engine runs passes), uploaded with the module as the artifact
# "engine-release". Dispatch it on main.
#
# A run on a branch saves its chunks in that branch's cache, which main
# cannot read. A manual run on main with "import_run" set to that run's id
# adds the run's chunk artifacts (kept a day) to main's cache, and runs
# nothing else.
#
# The schedule's jobs run at most 4 variant, 8 build-space and 8 page
# jobs at once (max-parallel), half of what it starts: they take up to
# six hours each, and the 40 the schedule starts would take every one of
# the account's 40 concurrent GitHub runners and leave a push's library
# jobs waiting. The other half start as the first finish. Manual runs are
# not held back.
#
# Caches of one branch must not be saved by two cache jobs at once: each
# restores the latest and adds its own chunks, so the one saved second
# would lack the first one's chunks, and the next restore takes only the
# latest. The cache job runs one at a time per branch (concurrency below),
# and restores the latest right before it saves.
name: compare

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      parts:
        description: 'Variant parts to run ("0-39", "3,7,12"), or "library" for the library builds and probes'
        default: library
      buildspace:
        description: 'Build-space parts to run ("0-79", "3,7,12"): one member''s constellation, refinement or weapon changed; empty for none'
        default: ""
      pages:
        description: 'Page parts to run ("0-79", "3,7,12"): the configs a result page runs besides the library''s; empty for none'
        default: ""
      warm:
        description: 'Team ids, comma-separated, whose gcsim runs to add to the cache (compare -gcsim-only); runs nothing else. Dispatch on main.'
        default: ""
      rerun:
        description: 'Builds to compare again, one job each, as team/build pairs the report names (team/cons:xingqiu=C0), comma-separated; runs nothing else. For a build whose settled verdict needs a closer look.'
        default: ""
      rerun_max_iter:
        description: 'Most iterations for rerun builds'
        default: "2048000"
      rerun_shards:
        description: 'Jobs to split each rerun build''s gcsim between, over seeds [0, rerun_max_iter), before its compare; 1 for none. Builds times shards at most 256.'
        default: "1"
      release:
        description: 'true runs every kind of build at this commit and writes the manifest of verified teams with the WebAssembly module (artifact engine-release). Dispatch on main.'
        default: "false"
      import_run:
        description: 'A run id of this workflow, on any branch, whose gcsim chunks (artifacts gcsim-new-*, kept a day) to add to this branch''s cache; runs nothing else. Dispatch on main.'
        default: ""
      import_release:
        description: 'A release tag of this repository whose gcsim-cache-*.tar.gz assets (gcsim run outside CI, reference/warm-host.sh) to add to this branch''s cache; runs nothing else. Dispatch on main.'
        default: ""

env:
  GSCOUTER_COMMIT: 9dfe65d914be5e4edca8b52e06795046de04d7e6
  PARTS: 40
  PER_DAY: 8
  BS_PARTS: 80
  BS_PER_DAY: 16
  PG_PARTS: 80
  PG_PER_DAY: 16
  # inside the workspace: actions/cache refuses paths with ".."
  GCSIM_CACHE: ${{ github.workspace }}/gcsim-cache

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      library: ${{ steps.plan.outputs.library }}
      parts: ${{ steps.plan.outputs.parts }}
      bs_parts: ${{ steps.plan.outputs.bs_parts }}
      pg_parts: ${{ steps.plan.outputs.pg_parts }}
      warm: ${{ steps.plan.outputs.warm }}
      warm_parts: ${{ steps.plan.outputs.warm_parts }}
      rerun: ${{ steps.plan.outputs.rerun }}
      rerun_shards: ${{ steps.plan.outputs.rerun_shards }}
      rerun_nshards: ${{ steps.plan.outputs.rerun_nshards }}
      rerun_max: ${{ steps.plan.outputs.rerun_max }}
    steps:
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ inputs.parts }}
          BS_INPUT: ${{ inputs.buildspace }}
          PG_INPUT: ${{ inputs.pages }}
          RELEASE: ${{ inputs.release }}
          WARM: ${{ inputs.warm }}
          IMPORT: ${{ inputs.import_run }}
          IMPORT_RELEASE: ${{ inputs.import_release }}
          RERUN: ${{ inputs.rerun }}
          RERUN_MAX: ${{ inputs.rerun_max_iter }}
          RERUN_SHARDS: ${{ inputs.rerun_shards }}
        run: |
          parts=""
          bs=""
          pg=""
          # strip all whitespace: a pasted list can carry a CRLF or newlines
          WARM=$(printf %s "$WARM" | tr -d "[:space:]")
          BS_INPUT=$(printf %s "$BS_INPUT" | tr -d "[:space:]")
          PG_INPUT=$(printf %s "$PG_INPUT" | tr -d "[:space:]")
          INPUT=$(printf %s "$INPUT" | tr -d "[:space:]")
          # ranges ("0-3,7") to a list of parts below the count given
          expand() {
            local out="" r
            for r in ${1//,/ }; do
              [[ $r =~ ^[0-9]+(-[0-9]+)?$ ]] || { echo "parts: cannot read $r" >&2; return 1; }
              if [[ $r == *-* ]]; then out+="$(seq -s, ${r%-*} ${r#*-}),"; else out+="$r,"; fi
            done
            out=${out%,}
            for p in ${out//,/ }; do
              [ "$p" -lt "$2" ] || { echo "part $p out of 0..$(( $2 - 1 ))" >&2; return 1; }
            done
            echo "$out"
          }
          IMPORT=$(printf %s "$IMPORT" | tr -d "[:space:]")
          RERUN=$(printf %s "$RERUN" | tr -d "[:space:]")
          RERUN_MAX=$(printf %s "$RERUN_MAX" | tr -d "[:space:]")
          RERUN_SHARDS=$(printf %s "$RERUN_SHARDS" | tr -d "[:space:]")
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$RERUN" ]; then
            [[ $RERUN =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.:=+-]+(,[A-Za-z0-9_.-]+/[A-Za-z0-9_.:=+-]+)*$ ]] || { echo "rerun: want team/build pairs separated by commas, got $RERUN"; exit 1; }
            [[ $RERUN_MAX =~ ^[1-9][0-9]*$ ]] || { echo "rerun_max_iter: want a number, got $RERUN_MAX"; exit 1; }
            [[ $RERUN_SHARDS =~ ^[1-9][0-9]*$ ]] || { echo "rerun_shards: want a number from 1, got $RERUN_SHARDS"; exit 1; }
            n=$(echo "$RERUN" | tr , '\n' | wc -l)
            [ "$n" -le 256 ] || { echo "rerun: at most 256 builds, got $n"; exit 1; }
            if [ "$RERUN_SHARDS" -gt 1 ]; then
              # shards are whole chunks of gcsim's cache (500 seeds)
              [ $(( RERUN_MAX % 500 )) -eq 0 ] || { echo "rerun_max_iter: want a multiple of 500 with rerun_shards above 1, got $RERUN_MAX"; exit 1; }
              [ "$RERUN_SHARDS" -le $(( RERUN_MAX / 500 )) ] || { echo "rerun_shards: at most rerun_max_iter / 500 = $(( RERUN_MAX / 500 )), got $RERUN_SHARDS"; exit 1; }
              # one matrix, at most 256 jobs
              [ $(( n * RERUN_SHARDS )) -le 256 ] || { echo "rerun: builds times rerun_shards at most 256, got $n x $RERUN_SHARDS"; exit 1; }
              echo "rerun_shards=[$(seq -s, 0 $(( RERUN_SHARDS - 1 )))]" >> "$GITHUB_OUTPUT"
            else
              echo "rerun_shards=[]" >> "$GITHUB_OUTPUT"
            fi
            # a job per build (and per shard), which reads its pair from the
            # input by index
            echo "library=false" >> "$GITHUB_OUTPUT"
            echo "parts=[]" >> "$GITHUB_OUTPUT"
            echo "bs_parts=[]" >> "$GITHUB_OUTPUT"
            echo "pg_parts=[]" >> "$GITHUB_OUTPUT"
            echo "warm_parts=[]" >> "$GITHUB_OUTPUT"
            echo "rerun=[$(seq -s, 0 $(( n - 1 )))]" >> "$GITHUB_OUTPUT"
            echo "rerun_nshards=$RERUN_SHARDS" >> "$GITHUB_OUTPUT"
            echo "rerun_max=$RERUN_MAX" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "rerun=[]" >> "$GITHUB_OUTPUT"
          echo "rerun_shards=[]" >> "$GITHUB_OUTPUT"
          IMPORT_RELEASE=$(printf %s "$IMPORT_RELEASE" | tr -d "[:space:]")
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$IMPORT_RELEASE" ]; then
            [[ $IMPORT_RELEASE =~ ^[A-Za-z0-9._-]+$ ]] || { echo "import_release: want a tag, got $IMPORT_RELEASE"; exit 1; }
          fi
          if [ "$EVENT" = workflow_dispatch ] && { [ -n "$IMPORT" ] || [ -n "$IMPORT_RELEASE" ]; }; then
            [ -z "$IMPORT" ] || [[ $IMPORT =~ ^[0-9]+$ ]] || { echo "import_run: want a run id, got $IMPORT"; exit 1; }
            # only the cache job runs, and takes that run's chunks
            echo "library=false" >> "$GITHUB_OUTPUT"
            echo "parts=[]" >> "$GITHUB_OUTPUT"
            echo "bs_parts=[]" >> "$GITHUB_OUTPUT"
            echo "pg_parts=[]" >> "$GITHUB_OUTPUT"
            echo "warm_parts=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = workflow_dispatch ] && [ -n "$WARM" ]; then
            [[ $WARM =~ ^[A-Za-z0-9_.-]+(,[A-Za-z0-9_.-]+)*$ ]] || { echo "warm: want team ids separated by commas, got $WARM"; exit 1; }
            # a job per team, up to 20 jobs
            n=$(echo "$WARM" | tr , '\n' | wc -l)
            n=$(( n < 20 ? n : 20 ))
            echo "library=false" >> "$GITHUB_OUTPUT"
            echo "parts=[]" >> "$GITHUB_OUTPUT"
            echo "bs_parts=[]" >> "$GITHUB_OUTPUT"
            echo "pg_parts=[]" >> "$GITHUB_OUTPUT"
            echo "warm=$WARM" >> "$GITHUB_OUTPUT"
            echo "warm_parts=[$(seq -s, 0 $(( n - 1 )))]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "warm_parts=[]" >> "$GITHUB_OUTPUT"
          RELEASE=$(printf %s "$RELEASE" | tr -d "[:space:]")
          if [ "$EVENT" = workflow_dispatch ] && [ "$RELEASE" = true ]; then
            echo "parts=[$(seq -s, 0 $(( PARTS - 1 )))]" >> "$GITHUB_OUTPUT"
            echo "bs_parts=[$(seq -s, 0 $(( BS_PARTS - 1 )))]" >> "$GITHUB_OUTPUT"
            echo "pg_parts=[$(seq -s, 0 $(( PG_PARTS - 1 )))]" >> "$GITHUB_OUTPUT"
            echo "library=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            day=$(( $(date -u +%s) / 86400 ))
            first=$(( (day % (PARTS / PER_DAY)) * PER_DAY ))
            parts=$(seq -s, $first $(( first + PER_DAY - 1 )))
            first=$(( (day % (BS_PARTS / BS_PER_DAY)) * BS_PER_DAY ))
            bs=$(seq -s, $first $(( first + BS_PER_DAY - 1 )))
            first=$(( (day % (PG_PARTS / PG_PER_DAY)) * PG_PER_DAY ))
            pg=$(seq -s, $first $(( first + PG_PER_DAY - 1 )))
          elif [ "$EVENT" = workflow_dispatch ]; then
            if [ "$INPUT" != library ]; then
              parts=$(expand "$INPUT" "$PARTS") || exit 1
            fi
            if [ -n "$BS_INPUT" ]; then
              bs=$(expand "$BS_INPUT" "$BS_PARTS") || exit 1
            fi
            if [ -n "$PG_INPUT" ]; then
              pg=$(expand "$PG_INPUT" "$PG_PARTS") || exit 1
            fi
          fi
          echo "parts=[$parts]" >> "$GITHUB_OUTPUT"
          echo "bs_parts=[$bs]" >> "$GITHUB_OUTPUT"
          echo "pg_parts=[$pg]" >> "$GITHUB_OUTPUT"
          if [ -z "$parts" ] && [ -z "$bs" ] && [ -z "$pg" ]; then
            echo "library=true" >> "$GITHUB_OUTPUT"
          else
            echo "library=false" >> "$GITHUB_OUTPUT"
          fi

  library:
    needs: plan
    if: needs.plan.outputs.library == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Engine tests
        if: matrix.part == 0
        working-directory: engine
        run: cargo test --release
      - name: WebAssembly module gives the engine's results
        if: matrix.part == 0
        run: wasm/parity.sh
      - name: Compare with gcsim
        working-directory: reference
        # work branches take the stored verdict of a build whose engine
        # output on its first 500 seeds has not moved (compare -reuse);
        # main runs every build in full and stores what it finds
        run: go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -only library,probes -shard ${{ matrix.part }}/4 -cache "$GCSIM_CACHE" ${{ github.ref != 'refs/heads/main' && '-reuse' || '' }} -json ../compare.json -md ../compare.md
      - name: Summary
        if: always()
        run: test -f compare.md && cat compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-library-${{ matrix.part }}
          path: |
            compare.json
            compare.md
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-library-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  variants:
    needs: plan
    if: needs.plan.outputs.parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'schedule' && 4 || 256 }}
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Compare with gcsim
        working-directory: reference
        run: go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -only variants -sample 4 -deadline 280m -shard ${{ matrix.part }}/${{ env.PARTS }} -cache "$GCSIM_CACHE" -json ../compare.json -md ../compare.md
      - name: Summary
        if: always()
        run: test -f compare.md && sed '/^## Unsupported/,$d' compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-variants-${{ matrix.part }}
          path: |
            compare.json
            compare.md
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-variants-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  buildspace:
    needs: plan
    if: needs.plan.outputs.bs_parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'schedule' && 8 || 256 }}
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.bs_parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Compare with gcsim
        working-directory: reference
        run: go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -only buildspace -sample 4 -deadline 280m -shard ${{ matrix.part }}/${{ env.BS_PARTS }} -cache "$GCSIM_CACHE" -json ../compare.json -md ../compare.md
      - name: Summary
        if: always()
        run: test -f compare.md && sed '/^## Unsupported/,$d' compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-buildspace-${{ matrix.part }}
          path: |
            compare.json
            compare.md
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-buildspace-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  pages:
    needs: plan
    if: needs.plan.outputs.pg_parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      max-parallel: ${{ github.event_name == 'schedule' && 8 || 256 }}
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.pg_parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Compare with gcsim
        working-directory: reference
        run: go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -only pages -sample 4 -deadline 280m -shard ${{ matrix.part }}/${{ env.PG_PARTS }} -cache "$GCSIM_CACHE" -json ../compare.json -md ../compare.md
      - name: Summary
        if: always()
        run: test -f compare.md && sed '/^## Unsupported/,$d' compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-pages-${{ matrix.part }}
          path: |
            compare.json
            compare.md
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-pages-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  # gcsim alone on a part of each rerun build's seeds (input rerun_shards)
  rerun-gcsim:
    needs: plan
    if: needs.plan.outputs.rerun != '[]' && needs.plan.outputs.rerun_shards != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.rerun) }}
        shard: ${{ fromJSON(needs.plan.outputs.rerun_shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      # build-space builds are assembled and checked with the engine
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Run gcsim on a part of the seeds
        working-directory: reference
        env:
          RERUN: ${{ inputs.rerun }}
          RERUN_MAX: ${{ needs.plan.outputs.rerun_max }}
          SHARDS: ${{ needs.plan.outputs.rerun_nshards }}
          SHARD: ${{ matrix.shard }}
        run: |
          b=$(printf %s "$RERUN" | tr -d "[:space:]" | cut -d, -f$(( ${{ matrix.part }} + 1 )))
          # chunks [c*k/n, c*(k+1)/n) of the c chunks of 500 seeds
          c=$(( RERUN_MAX / 500 ))
          lo=$(( c * SHARD / SHARDS * 500 ))
          hi=$(( c * (SHARD + 1) / SHARDS * 500 ))
          echo "build: $b, iterations $lo to $hi"
          go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -builds "$b" -gcsim-only -seeds "$lo:$hi" -deadline 300m -cache "$GCSIM_CACHE" -json ../warm.json -md ../warm.md
      - name: Summary
        if: always()
        run: test -f warm.md && cat warm.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rerun-gcsim-${{ matrix.part }}-${{ matrix.shard }}
          path: |
            warm.json
            warm.md
          if-no-files-found: ignore
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      # the build's rerun job takes these by name, then the cache job
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-rerun-gcsim-${{ matrix.part }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  rerun:
    needs: [plan, rerun-gcsim]
    # after the shards, whether they ran (rerun_shards above 1), failed or not
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.rerun != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.rerun) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      # the chunks this build's rerun-gcsim jobs computed
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.rerun_shards != '[]'
        continue-on-error: true
        with:
          pattern: gcsim-new-rerun-gcsim-${{ matrix.part }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/gcsim-shards
      # after the shards' chunks, so that this job uploads only what it adds
      - name: Add the shards' chunks and mark the cache's start
        run: |
          mkdir -p "$GCSIM_CACHE"
          if [ -d "$RUNNER_TEMP/gcsim-shards" ]; then
            echo "$(find "$RUNNER_TEMP/gcsim-shards" -type f | wc -l) chunks from the rerun-gcsim jobs"
            cp -r "$RUNNER_TEMP/gcsim-shards/." "$GCSIM_CACHE/"
          fi
          touch "$RUNNER_TEMP/cache-start"
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the engine
        working-directory: engine
        run: cargo build --release
      - name: Compare with gcsim
        working-directory: reference
        env:
          RERUN: ${{ inputs.rerun }}
          RERUN_MAX: ${{ needs.plan.outputs.rerun_max }}
        run: |
          b=$(printf %s "$RERUN" | tr -d "[:space:]" | cut -d, -f$(( ${{ matrix.part }} + 1 )))
          echo "build: $b"
          go run ./compare -gscouter ../gscouter -gse ../engine/target/release/gse -builds "$b" -max-iter "$RERUN_MAX" -deadline 300m -cache "$GCSIM_CACHE" -json ../compare.json -md ../compare.md
      - name: Summary
        if: always()
        run: test -f compare.md && sed '/^## Unsupported/,$d' compare.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compare-rerun-${{ matrix.part }}
          path: |
            compare.json
            compare.md
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-rerun-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  warm:
    needs: plan
    if: needs.plan.outputs.warm_parts != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.warm_parts) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: cenoda/Gscouter
          ref: ${{ env.GSCOUTER_COMMIT }}
          path: gscouter
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: |
            reference/go.sum
            gscouter/go.sum
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Mark the cache's start
        run: mkdir -p "$GCSIM_CACHE" && touch "$RUNNER_TEMP/cache-start"
      - name: Run gcsim into the cache
        working-directory: reference
        env:
          WARM: ${{ needs.plan.outputs.warm }}
          SHARDS: ${{ strategy.job-total }}
        run: go run ./compare -gscouter ../gscouter -gcsim-only -teams "$WARM" -only library,variants,probes -sample 4 -shard ${{ matrix.part }}/$SHARDS -cache "$GCSIM_CACHE" -json ../warm.json -md ../warm.md
      - name: Summary
        if: always()
        run: test -f warm.md && cat warm.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: warm-${{ matrix.part }}
          path: |
            warm.json
            warm.md
          if-no-files-found: ignore
      - name: Collect the chunks this job added
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/gcsim-new"
          cd "$GCSIM_CACHE" && find . -type f -name '*.json' -newer "$RUNNER_TEMP/cache-start" -exec cp --parents {} "$RUNNER_TEMP/gcsim-new" \;
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gcsim-new-warm-${{ matrix.part }}
          path: ${{ runner.temp }}/gcsim-new
          if-no-files-found: ignore
          retention-days: 1

  # the release's manifest: the verified teams and the module they hold for
  manifest:
    needs: [library, variants, buildspace, pages]
    if: always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: reference/go.mod
          cache-dependency-path: reference/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Build the WebAssembly module
        working-directory: wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - uses: actions/download-artifact@v4
        with:
          pattern: compare-*
          path: reports
      - name: Write the manifest
        run: |
          mkdir -p release
          cp wasm/target/wasm32-unknown-unknown/release/gse_wasm.wasm release/
          cd reference && go run ./manifest -wasm ../release/gse_wasm.wasm -commit "$GITHUB_SHA" -out ../release/manifest.json -approval ../release/approval.md ../reports/compare-*/compare.json | tee -a "$GITHUB_STEP_SUMMARY"
          cat ../release/approval.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: engine-release
          path: release

  cache:
    needs: [library, variants, buildspace, pages, warm, rerun-gcsim, rerun]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    # one at a time per branch, so that each restores what the last saved
    # (see the top). GitHub keeps one waiting job per group: a third that
    # comes while one runs and one waits cancels the waiting one, whose
    # chunks a later run then computes again (a cost, never a wrong result).
    concurrency:
      group: gcsim-cache-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: reference
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: gcsim-new-*
          merge-multiple: true
          path: ${{ runner.temp }}/gcsim-new
      # another run's chunks (input import_run): a run on a branch saves its
      # cache for that branch only, which main and other branches cannot read
      - uses: actions/download-artifact@v4
        if: inputs.import_run != ''
        with:
          pattern: gcsim-new-*
          merge-multiple: true
          path: ${{ runner.temp }}/gcsim-new
          run-id: ${{ inputs.import_run }}
          github-token: ${{ github.token }}
      # chunks gcsim made outside CI (input import_release): the release's
      # gcsim-cache-*.tar.gz assets, each a tree of the cache's files
      - name: Download the release's chunks
        if: inputs.import_release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.import_release }}
        run: |
          mkdir -p "$RUNNER_TEMP/release" "$RUNNER_TEMP/gcsim-new"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'gcsim-cache-*.tar.gz' --dir "$RUNNER_TEMP/release"
          for f in "$RUNNER_TEMP"/release/*.tar.gz; do tar -xzf "$f" -C "$RUNNER_TEMP/gcsim-new"; done
      - id: new
        run: echo "chunks=$(find "$RUNNER_TEMP/gcsim-new" -type f 2>/dev/null | wc -l)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: steps.new.outputs.chunks != '0'
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
          restore-keys: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-
      - name: Add the new chunks
        if: steps.new.outputs.chunks != '0'
        run: |
          mkdir -p "$GCSIM_CACHE" && cp -r "$RUNNER_TEMP/gcsim-new/." "$GCSIM_CACHE/"
          echo "${{ steps.new.outputs.chunks }} new chunks, $(find "$GCSIM_CACHE" -type f | wc -l) in all, $(du -sh "$GCSIM_CACHE" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache/save@v4
        if: steps.new.outputs.chunks != '0'
        with:
          path: ${{ env.GCSIM_CACHE }}
          key: gcsim-${{ hashFiles('reference/go.sum', 'reference/harness/*.go') }}-${{ github.run_id }}-${{ github.run_attempt }}
